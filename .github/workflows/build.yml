name: Build CWanticheat

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cwanticheat-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Bukkit/Paper plugin and source archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract source archive and apply punishment configs
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$GITHUB_WORKSPACE/CWanticheat-source.zip"
          if [[ ! -f "$ARCHIVE" ]]; then
            echo "::error::CWanticheat-source.zip was not found in the repository root."
            exit 1
          fi

          EXTRACT_DIR="$RUNNER_TEMP/cwanticheat-source"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ARCHIVE" -d "$EXTRACT_DIR"

          PROJECT_DIR=""
          if [[ -f "$EXTRACT_DIR/gradlew" ]]; then
            PROJECT_DIR="$EXTRACT_DIR"
          else
            WRAPPER="$(find "$EXTRACT_DIR" -type f -name gradlew -print -quit || true)"
            if [[ -n "$WRAPPER" ]]; then
              PROJECT_DIR="$(dirname "$WRAPPER")"
            else
              SETTINGS="$(find "$EXTRACT_DIR" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit || true)"
              if [[ -n "$SETTINGS" ]]; then
                PROJECT_DIR="$(dirname "$SETTINGS")"
              fi
            fi
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::Could not locate the Gradle project inside CWanticheat-source.zip."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"

          CONFIG_SOURCE="$GITHUB_WORKSPACE/CWanticheat/common/src/main/resources/punishments"
          if [[ -d "$CONFIG_SOURCE" ]]; then
            mkdir -p "$PROJECT_DIR/common/src/main/resources/punishments"
            cp -f "$CONFIG_SOURCE"/*.yml "$PROJECT_DIR/common/src/main/resources/punishments/"
            echo "Applied grouped punishment configs from the repository."
          else
            echo "::error::Grouped punishment config directory was not found."
            exit 1
          fi

          for folder in config messages; do
            RESOURCE_SOURCE="$GITHUB_WORKSPACE/CWanticheat/common/src/main/resources/$folder"
            if [[ -d "$RESOURCE_SOURCE" ]]; then
              mkdir -p "$PROJECT_DIR/common/src/main/resources/$folder"
              cp -f "$RESOURCE_SOURCE"/*.yml "$PROJECT_DIR/common/src/main/resources/$folder/"
            fi
          done

          SOURCE_OVERLAY="$GITHUB_WORKSPACE/CWanticheat/common/src/main/java"
          if [[ ! -d "$SOURCE_OVERLAY" ]]; then
            echo "::error::Check source overlay directory was not found."
            exit 1
          fi
          mkdir -p "$PROJECT_DIR/common/src/main/java"
          cp -a "$SOURCE_OVERLAY/." "$PROJECT_DIR/common/src/main/java/"
          echo "Applied new check source files from the repository."
          grep -q 'stableKey = "grim.inventory.auto_swap_c"' "$PROJECT_DIR/common/src/main/java/ac/grim/grimac/checks/impl/inventory/AutoSwapC.java"
          grep -q 'name = "AutoClickerA"' "$SOURCE_OVERLAY/ac/grim/grimac/checks/impl/ronex/RonexNewChecks.java"

          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path(sys.argv[1])

          # Publish the first stable CWanticheat release as 1.0.0.
          version_build = root / "build.gradle.kts"
          version_text = version_build.read_text(encoding="utf-8")
          version_text, version_count = re.subn(
              r'(?m)^val baseVersion = "[^"]+"
          def replace_once(path: Path, old: str, new: str):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one patch anchor in {path}, found {count}: {old[:90]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          manager = root / "common/src/main/java/ac/grim/grimac/manager/CheckManager.java"
          replace_once(manager, "import ac.grim.grimac.checks.impl.aim.AimDuplicateLook;",
              "import ac.grim.grimac.checks.impl.aim.AimA;\nimport ac.grim.grimac.checks.impl.aim.AimB;\nimport ac.grim.grimac.checks.impl.aim.AimF;\nimport ac.grim.grimac.checks.impl.baritone.BaritoneA;\nimport ac.grim.grimac.checks.impl.aim.AimDuplicateLook;")
          replace_once(manager, "import ac.grim.grimac.checks.impl.aim.AimDuplicateLook;",
              "import ac.grim.grimac.checks.impl.combat.AuraB;\nimport ac.grim.grimac.checks.impl.combat.KillAuraD;\nimport ac.grim.grimac.checks.impl.combat.CriticalsA;\nimport ac.grim.grimac.checks.impl.combat.InvHitA;\nimport ac.grim.grimac.checks.impl.combat.TriggerBotA;\nimport ac.grim.grimac.checks.impl.aim.ElytraAimA;\nimport ac.grim.grimac.checks.impl.aim.ElytraAimB;\nimport ac.grim.grimac.checks.impl.ronex.RonexAdvancedChecks;\nimport ac.grim.grimac.checks.impl.ronex.RonexExtraChecks;\nimport ac.grim.grimac.checks.impl.aim.AimDuplicateLook;")
          replace_once(manager, "import ac.grim.grimac.checks.impl.ronex.RonexExtraChecks;",
              "import ac.grim.grimac.checks.impl.ronex.RonexExtraChecks;\nimport ac.grim.grimac.checks.impl.ronex.RonexNewChecks;")
          replace_once(manager, "import ac.grim.grimac.checks.impl.groundspoof.NoFall;",
              "import ac.grim.grimac.checks.impl.groundspoof.NoFall;\nimport ac.grim.grimac.checks.impl.groundspoof.NoFallA;")
          replace_once(manager, "import ac.grim.grimac.checks.impl.movement.NoSlow;",
              "import ac.grim.grimac.checks.impl.movement.AirStuck;\nimport ac.grim.grimac.checks.impl.movement.AirStuckA;\nimport ac.grim.grimac.checks.impl.movement.AirStuckB;\nimport ac.grim.grimac.checks.impl.movement.HighJumpA;\nimport ac.grim.grimac.checks.impl.movement.NoSlow;\nimport ac.grim.grimac.checks.impl.movement.StrafeA;\nimport ac.grim.grimac.checks.impl.movement.StrafeB;\nimport ac.grim.grimac.checks.impl.movement.VoidClip;\nimport ac.grim.grimac.checks.impl.movement.NoSlowA;\nimport ac.grim.grimac.checks.impl.movement.NoSlowB;\nimport ac.grim.grimac.checks.impl.movement.NoSlowC;\nimport ac.grim.grimac.checks.impl.movement.NoWebA;\nimport ac.grim.grimac.checks.impl.movement.NoWebB;")
          replace_once(manager, ".put(Reach.class, new Reach(player))",
              ".put(Reach.class, new Reach(player))\n                .put(KillAuraA.class, new KillAuraA(player))\n                .put(KillAuraB.class, new KillAuraB(player))\n                .put(KillAuraC.class, new KillAuraC(player))")
          replace_once(manager, ".put(NoFall.class, new NoFall(player))",
              ".put(NoFall.class, new NoFall(player))\n                .put(NoFallA.class, new NoFallA(player))")
          replace_once(manager, ".put(AimProcessor.class, new AimProcessor(player))",
              ".put(AimProcessor.class, new AimProcessor(player))\n                .put(AimA.class, new AimA(player))\n                .put(AimB.class, new AimB(player))\n                .put(RonexNewChecks.AimC.class, new RonexNewChecks.AimC(player))\n                .put(RonexNewChecks.AimD.class, new RonexNewChecks.AimD(player))\n                .put(RonexNewChecks.AimE.class, new RonexNewChecks.AimE(player))\n                .put(AimF.class, new AimF(player))\n                .put(BaritoneA.class, new BaritoneA(player))")
          replace_once(manager, ".put(NoSlow.class, new NoSlow(player))",
              ".put(NoSlow.class, new NoSlow(player))\n                .put(NoSlowA.class, new NoSlowA(player))\n                .put(NoSlowB.class, new NoSlowB(player))\n                .put(NoSlowC.class, new NoSlowC(player))\n                .put(NoWebA.class, new NoWebA(player))\n                .put(NoWebB.class, new NoWebB(player))\n                .put(AirStuck.class, new AirStuck(player))\n                .put(AirStuckA.class, new AirStuckA(player))\n                .put(AirStuckB.class, new AirStuckB(player))\n                .put(HighJumpA.class, new HighJumpA(player))\n                .put(VoidClip.class, new VoidClip(player))\n                .put(StrafeA.class, new StrafeA(player))\n                .put(StrafeB.class, new StrafeB(player))")

          ground_spoof = root / "common/src/main/java/ac/grim/grimac/checks/impl/prediction/GroundSpoof.java"
          replace_once(ground_spoof,
              "        boolean claimed = player.clientClaimsLastOnGround;\n        if (claimed != player.onGround) {",
              "        boolean claimed = player.clientClaimsLastOnGround;\n        boolean sustainedNoFall = claimed && !player.onGround && player.fallDistance > 2.0 && player.actualMovement.getY() < -0.05;\n        if (claimed != player.onGround && !sustainedNoFall) {")

          replace_once(manager, ".put(RotationPlace.class, new RotationPlace(player))",
              ".put(RotationPlace.class, new RotationPlace(player))\n                .put(ScaffoldA.class, new ScaffoldA(player))")
          replace_once(manager, ".put(InventoryG.class, new InventoryG(player))",
              ".put(InventoryG.class, new InventoryG(player))\n                .put(AutoSwapA.class, new AutoSwapA(player))\n                .put(AutoSwapC.class, new AutoSwapC(player))\n                .put(GhostHandA.class, new GhostHandA(player))")

          replace_once(manager, ".put(KillAuraC.class, new KillAuraC(player))",
              ".put(KillAuraC.class, new KillAuraC(player))\n                .put(CriticalsA.class, new CriticalsA(player))\n                .put(TriggerBotA.class, new TriggerBotA(player))\n                .put(InvHitA.class, new InvHitA(player))\n                .put(RonexExtraChecks.AutoCrystalA.class, new RonexExtraChecks.AutoCrystalA(player))\n                .put(RonexExtraChecks.BlockReach.class, new RonexExtraChecks.BlockReach(player))\n                .put(RonexNewChecks.AutoClickerA.class, new RonexNewChecks.AutoClickerA(player))\n                .put(RonexNewChecks.MaceSwapA.class, new RonexNewChecks.MaceSwapA(player))\n                .put(RonexNewChecks.MorePacketsA.class, new RonexNewChecks.MorePacketsA(player))\n                .put(RonexNewChecks.AuraA.class, new RonexNewChecks.AuraA(player))\n                .put(AuraB.class, new AuraB(player))\n                .put(KillAuraD.class, new KillAuraD(player))")
          replace_once(manager, ".put(BaritoneA.class, new BaritoneA(player))",
              ".put(BaritoneA.class, new BaritoneA(player))\n                .put(RonexExtraChecks.BaritoneB.class, new RonexExtraChecks.BaritoneB(player))\n                .put(ElytraAimA.class, new ElytraAimA(player))\n                .put(ElytraAimB.class, new ElytraAimB(player))")
          replace_once(manager, ".put(ScaffoldA.class, new ScaffoldA(player))",
              ".put(ScaffoldA.class, new ScaffoldA(player))\n                .put(RonexExtraChecks.ScaffoldB.class, new RonexExtraChecks.ScaffoldB(player))\n                .put(RonexExtraChecks.ScaffoldC.class, new RonexExtraChecks.ScaffoldC(player))\n                .put(RonexNewChecks.ScaffoldD.class, new RonexNewChecks.ScaffoldD(player))")
          replace_once(manager, ".put(GhostHandA.class, new GhostHandA(player))",
              ".put(GhostHandA.class, new GhostHandA(player))\n                .put(RonexExtraChecks.ChestStealerA.class, new RonexExtraChecks.ChestStealerA(player))\n                .put(RonexAdvancedChecks.AutoFishA.class, new RonexAdvancedChecks.AutoFishA(player))")
          replace_once(manager, ".put(FastBreak.class, new FastBreak(player))",
              ".put(FastBreak.class, new FastBreak(player))\n                .put(RonexExtraChecks.BadDig.class, new RonexExtraChecks.BadDig(player))")

          config_manager = root / "common/src/main/java/ac/grim/grimac/manager/config/ConfigManagerFileImpl.java"
          replace_once(config_manager, "import java.util.regex.Pattern;",
              "import java.util.regex.Matcher;\nimport java.util.regex.Pattern;")
          replace_once(config_manager, "        ensureLightningCombatPunishments();",
              "        ensureLightningCombatPunishments();\n        ensureCustomCheckPunishmentGroups();")

          config_manager_helpers = r"""
              private void ensureCustomCheckPunishmentGroups() {
                  File punishments = getConfigFile("punishments.yml");
                  if (!punishments.exists()) return;
                  try {
                      String before = Files.readString(punishments.toPath());
                      String after = ensureCustomCheckPunishmentGroups(before);
                      if (!after.equals(before)) {
                          Files.writeString(punishments.toPath(), after);
                          LogUtil.info("Added missing CWanticheat check groups to punishments.yml");
                      }
                  } catch (IOException e) {
                      LogUtil.warn("Failed to add CWanticheat punishment groups: " + e);
                  }
              }

              static String ensureCustomCheckPunishmentGroups(String configString) {
                  if (!hasPunishmentsRoot(configString)) return configString;

                  String[][] groups = {
                          {"Aim", "AimA", "AimB", "AimC", "AimD", "AimE", "AimF"},
                          {"Scaffold", "ScaffoldA", "ScaffoldB", "ScaffoldC", "ScaffoldD"},
                          {"Baritone", "BaritoneA", "BaritoneB"},
                          {"ElytraAim", "ElytraAimA", "ElytraAimB"},
                          {"NoFall", "NoFallA"},
                          {"NoSlow", "NoSlowA", "NoSlowB", "NoSlowC"},
                          {"NoWeb", "NoWebA", "NoWebB"},
                          {"AirStuck", "AirStuck", "AirStuckA", "AirStuckB"},
                          {"HighJump", "HighJumpA"},
                          {"VoidClip", "VoidClip"},
                          {"Strafe", "StrafeA", "StrafeB"},
                          {"KillAura", "KillAuraA", "KillAuraB", "KillAuraC", "KillAuraD"},
                          {"BlockReach", "BlockReach"},
                          {"AutoCrystalA", "AutoCrystalA"},
                          {"CriticalsA", "CriticalsA"},
                          {"TriggerBotA", "TriggerBotA"},
                          {"ChestStealerA", "ChestStealerA"},
                          {"AutoFishA", "AutoFishA"},
                          {"BadDig", "BadDig"},
                          {"InvHitA", "InvHitA"},
                          {"AutoSwapA", "AutoSwapA"},
                          {"AutoSwapC", "AutoSwapC"},
                          {"GhostHandA", "GhostHandA"},
                          {"AutoClickerA", "AutoClickerA"},
                          {"MaceSwapA", "MaceSwapA"},
                          {"MorePacketsA", "MorePacketsA"},
                          {"Aura", "AuraA", "AuraB"}
                  };

                  String result = normalizeAuraPunishmentGroups(configString);
                  for (String[] mapping : groups) {
                      String[] checks = new String[mapping.length - 1];
                      System.arraycopy(mapping, 1, checks, 0, checks.length);
                      result = ensurePunishmentGroupChecks(result, mapping[0], checks);
                  }
                  return result;
              }

              private static String normalizeAuraPunishmentGroups(String configString) {
                  Pattern familyPattern = Pattern.compile("(?m)^  (Aura|AuraA|AuraB):\\s*$");
                  Matcher familyMatcher = familyPattern.matcher(configString);
                  int[] starts = new int[configString.length()];
                  int[] ends = new int[configString.length()];
                  String[] blocks = new String[3];
                  int count = 0;

                  while (familyMatcher.find()) {
                      String name = familyMatcher.group(1);
                      int kind = "Aura".equals(name) ? 0 : ("AuraA".equals(name) ? 1 : 2);
                      int end = configString.length();
                      Matcher nextGroup = Pattern.compile("(?m)^  [A-Za-z0-9_-]+:\\s*$").matcher(configString);
                      if (nextGroup.find(familyMatcher.end())) end = nextGroup.start();
                      if (blocks[kind] == null) {
                          blocks[kind] = configString.substring(familyMatcher.start(), end);
                      }
                      starts[count] = familyMatcher.start();
                      ends[count] = end;
                      count++;
                  }

                  if (count == 0) return configString;
                  String selectedBlock = blocks[0] != null ? blocks[0]
                          : (blocks[1] != null ? blocks[1] : blocks[2]);
                  selectedBlock = selectedBlock.replaceFirst(
                          "(?m)^  (?:Aura|AuraA|AuraB):\\s*$", "  Aura:");
                  Matcher checksHeader = Pattern.compile("(?m)^    checks:\\s*$").matcher(selectedBlock);
                  if (!checksHeader.find()) return configString;

                  StringBuilder additions = new StringBuilder();
                  for (String checkName : new String[]{"AuraA", "AuraB"}) {
                      boolean present = false;
                      for (String line : selectedBlock.split("\\n")) {
                          String item = line.trim();
                          if (item.equals("- \"" + checkName + "\"")
                                  || item.equals("- " + checkName)
                                  || item.equals("- '" + checkName + "'")) {
                              present = true;
                              break;
                          }
                      }
                      if (!present) additions.append("\\n      - \"").append(checkName).append("\"");
                  }
                  String mergedBlock = selectedBlock.substring(0, checksHeader.end())
                          + additions + selectedBlock.substring(checksHeader.end());

                  StringBuilder normalized = new StringBuilder();
                  int cursor = 0;
                  boolean inserted = false;
                  for (int i = 0; i < count; i++) {
                      normalized.append(configString, cursor, starts[i]);
                      if (!inserted) {
                          normalized.append(mergedBlock);
                          inserted = true;
                      }
                      cursor = ends[i];
                  }
                  normalized.append(configString.substring(cursor));
                  return normalized.toString();
              }

              private static String ensurePunishmentGroupChecks(String configString, String groupName, String[] checkNames) {
                  Pattern groupPattern = Pattern.compile("(?m)^  " + Pattern.quote(groupName) + ":\\s*$");
                  Matcher groupMatcher = groupPattern.matcher(configString);
                  if (!groupMatcher.find()) {
                      StringBuilder out = new StringBuilder(configString);
                      if (!configString.endsWith("\n")) out.append('\n');
                      out.append("\n  ").append(groupName).append(":\n")
                              .append("    remove-violations-after: 300\n")
                              .append("    checks:\n");
                      for (String checkName : checkNames) {
                          out.append("      - \"").append(checkName).append("\"\n");
                      }
                      out.append("    commands:\n")
                              .append("      - \"10:5 [alert]\"\n")
                              .append("      - \"1:1 [log]\"\n")
                              .append("      - \"20:10 [webhook]\"\n")
                              .append("      - \"20:10 [proxy]\"\n");
                      return out.toString();
                  }

                  int groupStart = groupMatcher.start();
                  int groupEnd = configString.length();
                  Matcher nextGroup = Pattern.compile("(?m)^  [A-Za-z0-9_-]+:\\s*$").matcher(configString);
                  if (nextGroup.find(groupMatcher.end())) groupEnd = nextGroup.start();

                  String groupBlock = configString.substring(groupStart, groupEnd);
                  Matcher checksHeader = Pattern.compile("(?m)^    checks:\\s*$").matcher(groupBlock);
                  if (!checksHeader.find()) return configString;

                  StringBuilder additions = new StringBuilder();
                  for (String checkName : checkNames) {
                      Pattern checkPattern = Pattern.compile("(?m)^      -\\s*[\"']?" + Pattern.quote(checkName) + "[\"']?\\s*$");
                      if (!checkPattern.matcher(groupBlock).find()) {
                          additions.append("\n      - \"").append(checkName).append("\"");
                      }
                  }
                  if (additions.length() == 0) return configString;

                  String updatedGroup = groupBlock.substring(0, checksHeader.end())
                          + additions
                          + groupBlock.substring(checksHeader.end());
                  return configString.substring(0, groupStart) + updatedGroup + configString.substring(groupEnd);
              }

          """.strip()
          replace_once(config_manager, "    private void ensureLightningCombatPunishments() {",
              config_manager_helpers + "\n\n    private void ensureLightningCombatPunishments() {")

          tick_manager = root / "common/src/main/java/ac/grim/grimac/manager/TickManager.java"
          replace_once(tick_manager, "import ac.grim.grimac.manager.tick.impl.ResetTick;",
              "import ac.grim.grimac.manager.tick.impl.AirStuckWatchdog;\nimport ac.grim.grimac.manager.tick.impl.ResetTick;")
          # FlagEvent is an async Bukkit event: run the AirStuck watchdog from asyncTick, not syncTick.
          replace_once(tick_manager, ".put(ResetTick.class, new ResetTick())",
              ".put(ResetTick.class, new ResetTick())")
          replace_once(tick_manager, ".put(TickInventory.class, new TickInventory())",
              ".put(TickInventory.class, new TickInventory())\n                .put(AirStuckWatchdog.class, new AirStuckWatchdog())")

          setback = root / "common/src/main/java/ac/grim/grimac/manager/SetbackTeleportUtil.java"
          replace_once(setback,
              "        Vector3dm clientVel = lastKnownGoodPosition.vector.clone();",
              "        boolean hardMovementSetback = !isResync && simulateNextTickPosition;\n        Vector3dm clientVel = lastKnownGoodPosition.vector.clone();\n        if (hardMovementSetback) {\n            clientVel.setX(0.0D);\n            clientVel.setY(0.0D);\n            clientVel.setZ(0.0D);\n        }")
          replace_once(setback,
              "        if (futureKb.first() != null && !futureKb.first().isSetback) {",
              "        if (!hardMovementSetback && futureKb.first() != null && !futureKb.first().isSetback) {")
          replace_once(setback,
              "        if (futureExplosion != null && (futureKb.first() == null",
              "        if (!hardMovementSetback && futureExplosion != null && (futureKb.first() == null")
          replace_once(setback,
              "        Vector3d position = lastKnownGoodPosition.pos;",
              "        Vector3d position = lastKnownGoodPosition.pos;\n        if (hardMovementSetback) {\n            double nudgeX = Math.abs(player.actualMovement.getX()) > 1.0E-6\n                    ? -Math.signum(player.actualMovement.getX()) * 0.001D : 0.001D;\n            double nudgeZ = Math.abs(player.actualMovement.getZ()) > 1.0E-6\n                    ? -Math.signum(player.actualMovement.getZ()) * 0.001D : 0.0D;\n            position = position.withX(position.getX() + nudgeX).withZ(position.getZ() + nudgeZ);\n        }")
          replace_once(setback,
              "import java.util.ArrayList;",
              "import java.util.ArrayDeque;\nimport java.util.ArrayList;")
          replace_once(setback,
              "    private long lastWorldResync = 0;",
              "    private long lastWorldResync = 0;\n    private final ArrayDeque<SetbackPosWithVector> recentValidPositions = new ArrayDeque<>(4);")
          replace_once(setback,
              "    public void executeForceResync() {",
              "    private void rememberValidPosition(Vector3dm velocity) {\n        SetbackPosWithVector valid = new SetbackPosWithVector(\n                new Vector3d(player.x, player.y, player.z), velocity.clone());\n        lastKnownGoodPosition = valid;\n        if (recentValidPositions.size() >= 4) recentValidPositions.removeFirst();\n        recentValidPositions.addLast(valid);\n    }\n\n    public void executeForceResync() {")
          replace_once(setback,
              "    public boolean executeViolationSetback() {\n        if (isExempt()) return false;\n        blockMovementsUntilResync(true, false);",
              "    public boolean executeViolationSetback() {\n        if (isExempt()) return false;\n        if (recentValidPositions.size() >= 4) {\n            SetbackPosWithVector bufferedSafePosition = recentValidPositions.peekFirst();\n            if (bufferedSafePosition != null) {\n                lastKnownGoodPosition = bufferedSafePosition;\n                recentValidPositions.clear();\n                recentValidPositions.addLast(bufferedSafePosition);\n            }\n        }\n        blockMovementsUntilResync(true, false);")
          setback_text = setback.read_text(encoding="utf-8")
          old_valid_update = "lastKnownGoodPosition = new SetbackPosWithVector(new Vector3d(player.x, player.y, player.z), afterTickFriction);"
          if setback_text.count(old_valid_update) != 2:
              raise SystemExit(f"Expected two last-known-good update sites, found {setback_text.count(old_valid_update)}")
          setback_text = setback_text.replace(old_valid_update, "rememberValidPosition(afterTickFriction);")
          setback.write_text(setback_text, encoding="utf-8")

          replace_once(setback,
              "            if (data.getVelocity() != null && data.getVelocity().lengthSquared() > 0) {",
              "            if (data.getVelocity() != null) {")
          replace_once(setback,
              "            simulateFriction(clientVel);",
              "            if (hardMovementSetback) {\n                clientVel.setX(0.0D);\n                clientVel.setY(0.0D);\n                clientVel.setZ(0.0D);\n            } else {\n                simulateFriction(clientVel);\n            }")


          engine = root / "common/src/main/java/ac/grim/grimac/predictionengine/predictions/PredictionEngine.java"
