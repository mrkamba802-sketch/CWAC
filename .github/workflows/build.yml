name: Build CWanticheat

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build JAR and source archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract source archive and apply punishment configs
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$GITHUB_WORKSPACE/CWanticheat-source.zip"
          if [[ ! -f "$ARCHIVE" ]]; then
            echo "::error::CWanticheat-source.zip was not found in the repository root."
            exit 1
          fi

          EXTRACT_DIR="$RUNNER_TEMP/cwanticheat-source"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ARCHIVE" -d "$EXTRACT_DIR"

          PROJECT_DIR=""
          if [[ -f "$EXTRACT_DIR/gradlew" ]]; then
            PROJECT_DIR="$EXTRACT_DIR"
          else
            WRAPPER="$(find "$EXTRACT_DIR" -type f -name gradlew -print -quit || true)"
            if [[ -n "$WRAPPER" ]]; then
              PROJECT_DIR="$(dirname "$WRAPPER")"
            else
              SETTINGS="$(find "$EXTRACT_DIR" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit || true)"
              if [[ -n "$SETTINGS" ]]; then
                PROJECT_DIR="$(dirname "$SETTINGS")"
              fi
            fi
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::Could not locate the Gradle project inside CWanticheat-source.zip."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"

          CONFIG_SOURCE="$GITHUB_WORKSPACE/CWanticheat/common/src/main/resources/punishments"
          if [[ -d "$CONFIG_SOURCE" ]]; then
            mkdir -p "$PROJECT_DIR/common/src/main/resources/punishments"
            cp -f "$CONFIG_SOURCE"/*.yml "$PROJECT_DIR/common/src/main/resources/punishments/"
            echo "Applied grouped punishment configs from the repository."
          else
            echo "::error::Grouped punishment config directory was not found."
            exit 1
          fi

      - name: Build project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean build
          else
            echo "::error::Gradle wrapper is missing from the source archive."
            exit 1
          fi

      - name: Collect JARs and package source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist/jar"

          found=0
          while IFS= read -r -d '' jar; do
            name="${jar#"$PROJECT_DIR"/}"
            name="${name//\//__}"
            cp "$jar" "$GITHUB_WORKSPACE/dist/jar/$name"
            found=1
          done < <(find "$PROJECT_DIR" -type f -path '*/build/libs/*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print0)

          if [[ "$found" -ne 1 ]]; then
            echo "::error::Build completed but no JAR files were found under build/libs."
            exit 1
          fi

          cd "$PROJECT_DIR"
          zip -qr "$GITHUB_WORKSPACE/dist/CWanticheat-source.zip" . \
            -x '*/build/*' '*/.gradle/*' '.gradle/*' '.git/*' '*/.git/*' '*/.idea/*'

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CWanticheat-JAR
          path: dist/jar/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: CWanticheat-source
          path: dist/CWanticheat-source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach JAR and source to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/jar/*
            dist/CWanticheat-source.zip
