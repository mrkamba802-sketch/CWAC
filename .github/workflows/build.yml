name: Build CWanticheat

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cwanticheat-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Bukkit/Paper plugin and source archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract source archive and apply punishment configs
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$GITHUB_WORKSPACE/CWanticheat-source.zip"
          if [[ ! -f "$ARCHIVE" ]]; then
            echo "::error::CWanticheat-source.zip was not found in the repository root."
            exit 1
          fi

          EXTRACT_DIR="$RUNNER_TEMP/cwanticheat-source"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ARCHIVE" -d "$EXTRACT_DIR"

          PROJECT_DIR=""
          if [[ -f "$EXTRACT_DIR/gradlew" ]]; then
            PROJECT_DIR="$EXTRACT_DIR"
          else
            WRAPPER="$(find "$EXTRACT_DIR" -type f -name gradlew -print -quit || true)"
            if [[ -n "$WRAPPER" ]]; then
              PROJECT_DIR="$(dirname "$WRAPPER")"
            else
              SETTINGS="$(find "$EXTRACT_DIR" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit || true)"
              if [[ -n "$SETTINGS" ]]; then
                PROJECT_DIR="$(dirname "$SETTINGS")"
              fi
            fi
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::Could not locate the Gradle project inside CWanticheat-source.zip."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"

          CONFIG_SOURCE="$GITHUB_WORKSPACE/CWanticheat/common/src/main/resources/punishments"
          if [[ -d "$CONFIG_SOURCE" ]]; then
            mkdir -p "$PROJECT_DIR/common/src/main/resources/punishments"
            cp -f "$CONFIG_SOURCE"/*.yml "$PROJECT_DIR/common/src/main/resources/punishments/"
            echo "Applied grouped punishment configs from the repository."
          else
            echo "::error::Grouped punishment config directory was not found."
            exit 1
          fi

          for folder in config messages; do
            RESOURCE_SOURCE="$GITHUB_WORKSPACE/CWanticheat/common/src/main/resources/$folder"
            if [[ -d "$RESOURCE_SOURCE" ]]; then
              mkdir -p "$PROJECT_DIR/common/src/main/resources/$folder"
              cp -f "$RESOURCE_SOURCE"/*.yml "$PROJECT_DIR/common/src/main/resources/$folder/"
            fi
          done

          SOURCE_OVERLAY="$GITHUB_WORKSPACE/CWanticheat/common/src/main/java"
          if [[ ! -d "$SOURCE_OVERLAY" ]]; then
            echo "::error::Check source overlay directory was not found."
            exit 1
          fi
          mkdir -p "$PROJECT_DIR/common/src/main/java"
          cp -a "$SOURCE_OVERLAY/." "$PROJECT_DIR/common/src/main/java/"
          echo "Applied new check source files from the repository."

          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])

          def replace_once(path: Path, old: str, new: str):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one patch anchor in {path}, found {count}: {old[:90]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          manager = root / "common/src/main/java/ac/grim/grimac/manager/CheckManager.java"
          replace_once(manager, "import ac.grim.grimac.checks.impl.aim.AimDuplicateLook;",
              "import ac.grim.grimac.checks.impl.aim.AimA;\nimport ac.grim.grimac.checks.impl.aim.AimB;\nimport ac.grim.grimac.checks.impl.baritone.BaritoneA;\nimport ac.grim.grimac.checks.impl.aim.AimDuplicateLook;")
          replace_once(manager, "import ac.grim.grimac.checks.impl.groundspoof.NoFall;",
              "import ac.grim.grimac.checks.impl.groundspoof.NoFall;\nimport ac.grim.grimac.checks.impl.groundspoof.NoFallA;")
          replace_once(manager, "import ac.grim.grimac.checks.impl.movement.NoSlow;",
              "import ac.grim.grimac.checks.impl.movement.AirStuck;\nimport ac.grim.grimac.checks.impl.movement.AirStuckA;\nimport ac.grim.grimac.checks.impl.movement.HighJumpA;\nimport ac.grim.grimac.checks.impl.movement.NoSlow;\nimport ac.grim.grimac.checks.impl.movement.StrafeA;\nimport ac.grim.grimac.checks.impl.movement.StrafeB;\nimport ac.grim.grimac.checks.impl.movement.VoidClip;\nimport ac.grim.grimac.checks.impl.movement.NoSlowA;\nimport ac.grim.grimac.checks.impl.movement.NoWebA;\nimport ac.grim.grimac.checks.impl.movement.NoWebB;")
          replace_once(manager, ".put(Reach.class, new Reach(player))",
              ".put(Reach.class, new Reach(player))\n                .put(KillAuraA.class, new KillAuraA(player))\n                .put(KillAuraB.class, new KillAuraB(player))")
          replace_once(manager, ".put(NoFall.class, new NoFall(player))",
              ".put(NoFall.class, new NoFall(player))\n                .put(NoFallA.class, new NoFallA(player))")
          replace_once(manager, ".put(AimProcessor.class, new AimProcessor(player))",
              ".put(AimProcessor.class, new AimProcessor(player))\n                .put(AimA.class, new AimA(player))\n                .put(AimB.class, new AimB(player))\n                .put(BaritoneA.class, new BaritoneA(player))")
          replace_once(manager, ".put(NoSlow.class, new NoSlow(player))",
              ".put(NoSlow.class, new NoSlow(player))\n                .put(NoSlowA.class, new NoSlowA(player))\n                .put(NoWebA.class, new NoWebA(player))\n                .put(NoWebB.class, new NoWebB(player))\n                .put(AirStuck.class, new AirStuck(player))\n                .put(AirStuckA.class, new AirStuckA(player))\n                .put(HighJumpA.class, new HighJumpA(player))\n                .put(VoidClip.class, new VoidClip(player))\n                .put(StrafeA.class, new StrafeA(player))\n                .put(StrafeB.class, new StrafeB(player))")

          ground_spoof = root / "common/src/main/java/ac/grim/grimac/checks/impl/prediction/GroundSpoof.java"
          replace_once(ground_spoof,
              "        boolean claimed = player.clientClaimsLastOnGround;\n        if (claimed != player.onGround) {",
              "        boolean claimed = player.clientClaimsLastOnGround;\n        boolean sustainedNoFall = claimed && !player.onGround && player.fallDistance > 2.0 && player.actualMovement.getY() < -0.05;\n        if (claimed != player.onGround && !sustainedNoFall) {")

          replace_once(manager, ".put(RotationPlace.class, new RotationPlace(player))",
              ".put(RotationPlace.class, new RotationPlace(player))\n                .put(ScaffoldA.class, new ScaffoldA(player))")
          replace_once(manager, ".put(InventoryG.class, new InventoryG(player))",
              ".put(InventoryG.class, new InventoryG(player))\n                .put(AutoSwapA.class, new AutoSwapA(player))\n                .put(GhostHandA.class, new GhostHandA(player))")

          tick_manager = root / "common/src/main/java/ac/grim/grimac/manager/TickManager.java"
          replace_once(tick_manager, "import ac.grim.grimac.manager.tick.impl.ResetTick;",
              "import ac.grim.grimac.manager.tick.impl.AirStuckWatchdog;\nimport ac.grim.grimac.manager.tick.impl.ResetTick;")
          replace_once(tick_manager, ".put(ResetTick.class, new ResetTick())",
              ".put(ResetTick.class, new ResetTick())\n                .put(AirStuckWatchdog.class, new AirStuckWatchdog())")

          setback = root / "common/src/main/java/ac/grim/grimac/manager/SetbackTeleportUtil.java"
          replace_once(setback,
              "        Vector3dm clientVel = lastKnownGoodPosition.vector.clone();",
              "        boolean hardMovementSetback = !isResync && simulateNextTickPosition;\n        Vector3dm clientVel = lastKnownGoodPosition.vector.clone();\n        if (hardMovementSetback) {\n            clientVel.setX(0.0D);\n            clientVel.setY(0.0D);\n            clientVel.setZ(0.0D);\n        }")
          replace_once(setback,
              "        if (futureKb.first() != null && !futureKb.first().isSetback) {",
              "        if (!hardMovementSetback && futureKb.first() != null && !futureKb.first().isSetback) {")
          replace_once(setback,
              "        if (futureExplosion != null && (futureKb.first() == null",
              "        if (!hardMovementSetback && futureExplosion != null && (futureKb.first() == null")
          replace_once(setback,
              "        Vector3d position = lastKnownGoodPosition.pos;",
              "        Vector3d position = lastKnownGoodPosition.pos;\n        if (hardMovementSetback) {\n            double nudgeX = Math.abs(player.actualMovement.getX()) > 1.0E-6\n                    ? -Math.signum(player.actualMovement.getX()) * 0.001D : 0.001D;\n            double nudgeZ = Math.abs(player.actualMovement.getZ()) > 1.0E-6\n                    ? -Math.signum(player.actualMovement.getZ()) * 0.001D : 0.0D;\n            position = position.withX(position.getX() + nudgeX).withZ(position.getZ() + nudgeZ);\n        }")
          replace_once(setback,
              "import java.util.ArrayList;",
              "import java.util.ArrayDeque;\nimport java.util.ArrayList;")
          replace_once(setback,
              "    private long lastWorldResync = 0;",
              "    private long lastWorldResync = 0;\n    private final ArrayDeque<SetbackPosWithVector> recentValidPositions = new ArrayDeque<>(4);")
          replace_once(setback,
              "    public void executeForceResync() {",
              "    private void rememberValidPosition(Vector3dm velocity) {\n        SetbackPosWithVector valid = new SetbackPosWithVector(\n                new Vector3d(player.x, player.y, player.z), velocity.clone());\n        lastKnownGoodPosition = valid;\n        if (recentValidPositions.size() >= 4) recentValidPositions.removeFirst();\n        recentValidPositions.addLast(valid);\n    }\n\n    public void executeForceResync() {")
          replace_once(setback,
              "    public boolean executeViolationSetback() {\n        if (isExempt()) return false;\n        blockMovementsUntilResync(true, false);",
              "    public boolean executeViolationSetback() {\n        if (isExempt()) return false;\n        if (recentValidPositions.size() >= 4) {\n            SetbackPosWithVector bufferedSafePosition = recentValidPositions.peekFirst();\n            if (bufferedSafePosition != null) {\n                lastKnownGoodPosition = bufferedSafePosition;\n                recentValidPositions.clear();\n                recentValidPositions.addLast(bufferedSafePosition);\n            }\n        }\n        blockMovementsUntilResync(true, false);")
          setback_text = setback.read_text(encoding="utf-8")
          old_valid_update = "lastKnownGoodPosition = new SetbackPosWithVector(new Vector3d(player.x, player.y, player.z), afterTickFriction);"
          if setback_text.count(old_valid_update) != 2:
              raise SystemExit(f"Expected two last-known-good update sites, found {setback_text.count(old_valid_update)}")
          setback_text = setback_text.replace(old_valid_update, "rememberValidPosition(afterTickFriction);")
          setback.write_text(setback_text, encoding="utf-8")

          replace_once(setback,
              "            if (data.getVelocity() != null && data.getVelocity().lengthSquared() > 0) {",
              "            if (data.getVelocity() != null) {")
          replace_once(setback,
              "            simulateFriction(clientVel);",
              "            if (hardMovementSetback) {\n                clientVel.setX(0.0D);\n                clientVel.setY(0.0D);\n                clientVel.setZ(0.0D);\n            } else {\n                simulateFriction(clientVel);\n            }")


          engine = root / "common/src/main/java/ac/grim/grimac/predictionengine/predictions/PredictionEngine.java"
          replace_once(engine, "package ac.grim.grimac.predictionengine.predictions;\n",
              "package ac.grim.grimac.predictionengine.predictions;\n\nimport ac.grim.grimac.checks.impl.movement.NoSlowA;\nimport ac.grim.grimac.checks.impl.movement.NoWebA;\nimport ac.grim.grimac.checks.impl.movement.NoWebB;\n")
          replace_once(engine,
              "player.checkManager.getNoSlow().handlePredictionAnalysis(Math.sqrt(player.uncertaintyHandler.reduceOffset(resultAccuracy)));",
              "double itemUseOffset = Math.sqrt(player.uncertaintyHandler.reduceOffset(resultAccuracy));\n                player.checkManager.getNoSlow().handlePredictionAnalysis(itemUseOffset);\n                player.checkManager.get(NoSlowA.class).handlePredictionAnalysis(itemUseOffset);")
          replace_once(engine,
              "            if (player.checkManager.getKnockbackHandler().shouldIgnoreForPrediction(clientVelAfterInput) ||",
              "            int webMask = StuckSpeed.COBWEB.getIndex() | StuckSpeed.COBWEB_WEAVING.getIndex();\n            if ((clientVelAfterInput.stuckSpeedMultiplier.getIndex() & webMask) != 0) {\n                double webOffset = Math.sqrt(player.uncertaintyHandler.reduceOffset(resultAccuracy));\n                player.checkManager.get(NoWebA.class).handlePredictionAnalysis(webOffset);\n\n                double horizontalError = Math.pow(outputVel.getX() - player.actualMovement.getX(), 2)\n                        + Math.pow(outputVel.getZ() - player.actualMovement.getZ(), 2);\n                double horizontalOffset = Math.sqrt(player.uncertaintyHandler.reduceOffset(horizontalError));\n                player.checkManager.get(NoWebB.class).handlePredictionAnalysis(horizontalOffset);\n            }\n\n            if (player.checkManager.getKnockbackHandler().shouldIgnoreForPrediction(clientVelAfterInput) ||")
          # Give the prediction check its user-facing name without changing its engine.
          offset_handler = root / "common/src/main/java/ac/grim/grimac/checks/impl/prediction/OffsetHandler.java"
          offset_text = offset_handler.read_text(encoding="utf-8")
          offset_text = offset_text.replace(
              '@CheckData(name = "Simulation", stableKey = "grim.prediction.simulation"',
              '@CheckData(name = "Prediction", stableKey = "grim.prediction.model"')
          offset_text = offset_text.replace('"Simulation.', '"Prediction.')
          offset_handler.write_text(offset_text, encoding="utf-8")

          knockback = root / "common/src/main/java/ac/grim/grimac/checks/impl/velocity/KnockbackHandler.java"
          knockback_text = knockback.read_text(encoding="utf-8")
          old_annotation = '@CheckData(name = "AntiKB", stableKey = "grim.velocity.anti_knockback", alternativeName = "AntiKnockback", configName = "Knockback"'
          new_annotation = '@CheckData(name = "VelocityA", stableKey = "grim.velocity.velocity_a", alternativeName = "AntiKB", configName = "Knockback"'
          if knockback_text.count(old_annotation) != 1:
              raise SystemExit("Expected one AntiKB annotation in KnockbackHandler")
          knockback.write_text(knockback_text.replace(old_annotation, new_annotation, 1), encoding="utf-8")

          no_slow_a = root / "common/src/main/java/ac/grim/grimac/checks/impl/movement/NoSlowA.java"
          no_slow_a_text = no_slow_a.read_text(encoding="utf-8")
          no_slow_a_text = no_slow_a_text.replace("0.0005", "0.0001")
          no_slow_a_text = no_slow_a_text.replace("suspiciousTicks >= 3", "suspiciousTicks >= 2")
          no_slow_a.write_text(no_slow_a_text, encoding="utf-8")

          # Keep the alert prefix and player name unbolded in both runtime fallbacks and locale messages.
          for relative in (
              "common/src/main/java/ac/grim/grimac/manager/PunishmentManager.java",
              "common/src/main/java/ac/grim/grimac/manager/config/BaseConfigManager.java",
              "common/src/main/java/ac/grim/grimac/utils/anticheat/MessageUtil.java",
              "common/src/main/resources/messages/en.yml",
              "common/src/main/resources/messages/ru.yml",
          ):
              path = root / relative
              text = path.read_text(encoding="utf-8")
              text = text.replace("<bold>CWanticheat</bold>", "CWanticheat")
              text = text.replace("<bold>%player%</bold>", "%player%")
              text = text.replace("<bold>%check_name%</bold>", "%check_name%")
              path.write_text(text, encoding="utf-8")

          # Align the packaged default config with the renamed checks and ship parameters for every new check.
          import re
          new_check_defaults = {
              "NoSlowA": "NoSlowA:\n    threshold: 0.00005",
              "NoWebA": "NoWebA:\n    threshold: 0.0005",
              "NoWebB": "NoWebB:\n    threshold: 0.0003",
              "AirStuck": "AirStuck:\n    threshold: 0.03",
              "AirStuckA": "AirStuckA:\n    packet-silence-ticks: 12\n    vertical-offset-threshold: 0.005\n    action-suppression-ticks: 18",
              "HighJumpA": "HighJumpA:\n    vertical-excess-threshold: 0.12",
              "ScaffoldA": "ScaffoldA:\n    evidence-to-flag: 5",
              "AutoSwapA": "AutoSwapA:\n    cycle-window-ms: 350",
              "GhostHandA": "GhostHandA:\n    evidence-to-cancel: 2",
              "AimB": "AimB:\n    snap-threshold: 35.0\n    gcd-tolerance: 0.02",
              "KillAuraA": "KillAuraA:\n    align-threshold: 4.0\n    snap-threshold: 35.0",
              "KillAuraB": "KillAuraB:\n    angle-threshold: 80.0",
              "BaritoneA": "BaritoneA:\n    required-evidence: 16\n    max-pitch-step: 1.0",
              "VoidClip": "VoidClip:\n    vertical-error-threshold: 0.35\n    prediction-offset-threshold: 0.15\n    required-streak: 2",
              "StrafeA": "StrafeA:\n    horizontal-excess-threshold: 0.025\n    prediction-offset-threshold: 0.012\n    required-streak: 4",
              "StrafeB": "StrafeB:\n    lateral-error-threshold: 0.02\n    prediction-offset-threshold: 0.015\n    required-streak: 3",
          }
          for lang in ("en", "ru"):
              config_path = root / "common/src/main/resources/config" / f"{lang}.yml"
              config_text = config_path.read_text(encoding="utf-8")
              config_text = re.sub(r"(?m)^Simulation:", "Prediction:", config_text, count=1)

              # Lower the actual NoSlow threshold, not unrelated thresholds elsewhere in the config.
              match = re.search(r"(?ms)^NoSlow:\n(.*?)(?=^[A-Za-z][A-Za-z0-9_-]*:\n|\Z)", config_text)
              if not match:
                  raise SystemExit(f"NoSlow config section missing in {config_path}")
              no_slow_section = match.group(1)
              no_slow_section, count = re.subn(r"(?m)^    threshold: 0\.001$", "    threshold: 0.0001", no_slow_section, count=1)
              if count != 1:
                  raise SystemExit(f"NoSlow threshold not found in {config_path}")
              config_text = config_text[:match.start(1)] + no_slow_section + config_text[match.end(1):]

              for key, block in new_check_defaults.items():
                  if re.search(rf"(?m)^{re.escape(key)}:", config_text):
                      continue
                  config_text = config_text.rstrip() + "\n\n" + block + "\n"
              config_path.write_text(config_text, encoding="utf-8")

          # Keep only English and Russian resource locales, with English as fallback for all others.
          for folder_name in ("config", "messages", "punishments", "database", "discord"):
              folder = root / "common/src/main/resources" / folder_name
              if folder.exists():
                  for locale_file in folder.glob("*.yml"):
                      if locale_file.stem not in ("en", "ru"):
                          locale_file.unlink()

          print("Applied renamed checks, AirStuck watchdog, new checks, stricter NoSlow defaults, unbolded alerts, and ru/en-only locales.")
          PY

      - name: Build only the Bukkit/Paper plugin
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon clean :bukkit:shadowJar -Prelease=true -PshadePE=true -Prelocate=true

      - name: Verify and package the ready-to-install plugin and source
        shell: bash
        run: |
          set -euo pipefail

          PLUGIN_DIR="$PROJECT_DIR/bukkit/build/libs"
          mapfile -t PLUGIN_JARS < <(find "$PLUGIN_DIR" -maxdepth 1 -type f -name 'cwanticheat-bukkit-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)

          if [[ "${#PLUGIN_JARS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one cwanticheat-bukkit plugin JAR, found ${#PLUGIN_JARS[@]}."
            printf '%s\n' "${PLUGIN_JARS[@]}"
            exit 1
          fi

          PLUGIN_JAR="${PLUGIN_JARS[0]}"
          unzip -tq "$PLUGIN_JAR"
          unzip -p "$PLUGIN_JAR" plugin.yml > "$RUNNER_TEMP/plugin.yml"

          grep -Eq '^name: CWanticheat$' "$RUNNER_TEMP/plugin.yml"
          grep -Eq '^main: ac\.grim\.grimac\.platform\.bukkit\.GrimACBukkitLoaderPlugin$' "$RUNNER_TEMP/plugin.yml"

          jar tf "$PLUGIN_JAR" > "$RUNNER_TEMP/plugin-entries.txt"
          if ! grep -q '^ac/grim/grimac/shaded/packetevents/' "$RUNNER_TEMP/plugin-entries.txt"; then
            echo "::error::PacketEvents classes are missing; refusing to publish a non-standalone plugin."
            exit 1
          fi

          for class in \
            ac/grim/grimac/checks/impl/movement/AirStuckA.class \
            ac/grim/grimac/checks/impl/movement/HighJumpA.class \
            ac/grim/grimac/checks/impl/inventory/AutoSwapA.class \
            ac/grim/grimac/checks/impl/inventory/GhostHandA.class \
            ac/grim/grimac/checks/impl/scaffolding/ScaffoldA.class \
            ac/grim/grimac/checks/impl/baritone/BaritoneA.class \
            ac/grim/grimac/checks/impl/movement/VoidClip.class \
            ac/grim/grimac/checks/impl/movement/StrafeA.class \
            ac/grim/grimac/checks/impl/movement/StrafeB.class \
            ac/grim/grimac/manager/tick/impl/AirStuckWatchdog.class; do
            if ! grep -q "^$class$" "$RUNNER_TEMP/plugin-entries.txt"; then
              echo "::error::Missing new check class in the plugin: $class"
              exit 1
            fi
          done

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$PLUGIN_JAR" "$GITHUB_WORKSPACE/dist/CWanticheat.jar"
          echo "Verified ready-to-install Bukkit/Paper plugin: dist/CWanticheat.jar"

          cd "$PROJECT_DIR"
          zip -qr "$GITHUB_WORKSPACE/dist/CWanticheat-source.zip" . \
            -x '*/build/*' '*/.gradle/*' '.gradle/*' '.git/*' '*/.git/*' '*/.idea/*'

      - name: Upload ready-to-install plugin
        uses: actions/upload-artifact@v4
        with:
          name: CWanticheat-JAR
          path: dist/CWanticheat.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: CWanticheat-source
          path: dist/CWanticheat-source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach plugin and source to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CWanticheat.jar
            dist/CWanticheat-source.zip
