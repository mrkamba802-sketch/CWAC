          # Give the prediction check its user-facing name without changing its engine.
          offset_handler = root / "common/src/main/java/ac/grim/grimac/checks/impl/prediction/OffsetHandler.java"
          offset_text = offset_handler.read_text(encoding="utf-8")
          offset_text = offset_text.replace(
              '@CheckData(name = "Simulation", stableKey = "grim.prediction.simulation"',
              '@CheckData(name = "Prediction", stableKey = "grim.prediction.model"')
          offset_text = offset_text.replace('"Simulation.', '"Prediction.')
          offset_handler.write_text(offset_text, encoding="utf-8")

          knockback = root / "common/src/main/java/ac/grim/grimac/checks/impl/velocity/KnockbackHandler.java"
          knockback_text = knockback.read_text(encoding="utf-8")
          old_annotation = '@CheckData(name = "AntiKB", stableKey = "grim.velocity.anti_knockback", alternativeName = "AntiKnockback", configName = "Knockback"'
          new_annotation = '@CheckData(name = "VelocityA", stableKey = "grim.velocity.velocity_a", alternativeName = "AntiKB", configName = "Knockback"'
          if knockback_text.count(old_annotation) != 1:
              raise SystemExit("Expected one AntiKB annotation in KnockbackHandler")
          knockback.write_text(knockback_text.replace(old_annotation, new_annotation, 1), encoding="utf-8")

          no_slow_a = root / "common/src/main/java/ac/grim/grimac/checks/impl/movement/NoSlowA.java"
          no_slow_a_text = no_slow_a.read_text(encoding="utf-8")
          no_slow_a_text = no_slow_a_text.replace("0.0005", "0.0001")
          no_slow_a_text = no_slow_a_text.replace("suspiciousTicks >= 3", "suspiciousTicks >= 2")
          no_slow_a.write_text(no_slow_a_text, encoding="utf-8")

          # Keep the alert prefix and player name unbolded in both runtime fallbacks and locale messages.
          for relative in (
              "common/src/main/java/ac/grim/grimac/manager/PunishmentManager.java",
              "common/src/main/java/ac/grim/grimac/manager/config/BaseConfigManager.java",
              "common/src/main/java/ac/grim/grimac/utils/anticheat/MessageUtil.java",
              "common/src/main/resources/messages/en.yml",
              "common/src/main/resources/messages/ru.yml",
          ):
              path = root / relative
              text = path.read_text(encoding="utf-8")
              text = text.replace("<bold>CWanticheat</bold>", "CWanticheat")
              text = text.replace("<bold>%player%</bold>", "%player%")
              text = text.replace("<bold>%check_name%</bold>", "%check_name%")
              path.write_text(text, encoding="utf-8")

          # Align the packaged default config with the renamed checks and ship parameters for every new check.
          import re
          new_check_defaults = {
              "NoSlowA": "NoSlowA:\n    threshold: 0.00005",
              "NoSlowB": "NoSlowB:\n    threshold: 0.0025\n    sample-window: 8\n    required-samples: 6\n    evidence-timeout-ms: 900",
              "NoSlowC": "NoSlowC:\n    threshold: 0.00012\n    sample-window: 8\n    required-samples: 6",
              "NoWebA": "NoWebA:\n    threshold: 0.0005",
              "NoWebB": "NoWebB:\n    threshold: 0.0003",
              "AirStuck": "AirStuck:\n    threshold: 0.03",
              "AirStuckA": "AirStuckA:\n    packet-silence-ticks: 12\n    vertical-offset-threshold: 0.005\n    action-suppression-ticks: 18",
              "AirStuckB": "AirStuckB:\n    predicted-y-threshold: 0.10\n    maximum-actual-y: 0.035\n    minimum-offset: 0.0025\n    window: 8\n    required-samples: 6",
              "HighJumpA": "HighJumpA:\n    vertical-excess-threshold: 0.12",
              "ScaffoldA": "ScaffoldA:\n    evidence-to-flag: 6",
              "AutoSwapA": "AutoSwapA:\n    cycle-window-ms: 350",
              "AutoSwap": "AutoSwap:\n    c:\n        debug: false",
              "GhostHandA": "GhostHandA:\n    evidence-to-cancel: 2",
              "AimB": "AimB:\n    snap-threshold: 50.0\n    gcd-tolerance: 0.08\n    required-evidence: 5",
              "KillAuraA": "KillAuraA:\n    maximum-attack-gap-ms: 80\n    burst-window-ms: 5000\n    required-bursts: 3",
              "KillAuraB": "KillAuraB:\n    minimum-excess-degrees: 10.0\n    maximum-distance: 5.0\n    required-hits: 4\n    hit-window: 8",
              "KillAuraC": "KillAuraC:\n    maximum-distance: 5.0\n    required-hits: 3\n    hit-window: 6",
              "KillAuraD": "KillAuraD:\n    minimum-target-angle-degrees: 14.0\n    maximum-observed-turn-degrees: 5.0\n    maximum-distance: 6.0\n    maximum-attack-gap-ms: 250\n    window: 8\n    required-switches: 4",
              "BaritoneA": "BaritoneA:\n    required-evidence: 16\n    max-pitch-step: 1.0",
              "VoidClip": "VoidClip:\n    vertical-error-threshold: 0.35\n    prediction-offset-threshold: 0.15\n    required-streak: 2",
              "StrafeA": "StrafeA:\n    horizontal-excess-threshold: 0.025\n    prediction-offset-threshold: 0.012\n    required-streak: 4",
              "StrafeB": "StrafeB:\n    lateral-error-threshold: 0.02\n    prediction-offset-threshold: 0.015\n    required-streak: 3",
              "BlockReach": "BlockReach:\n    maximum-distance: 6.0",
              "ScaffoldB": "ScaffoldB:\n    minimum-speed: 0.10\n    minimum-fall-speed: 0.24\n    maximum-interval-variation: 0.35\n    required-placements: 6",
              "ScaffoldC": "ScaffoldC:\n    minimum-speed: 0.08\n    maximum-distance: 5.0\n    window: 8\n    required: 5",
              "AutoCrystalA": "AutoCrystalA:\n    window-ms: 2000\n    required-cycles: 6",
              "CriticalsA": "CriticalsA:\n    grounded-vertical-epsilon: 0.02\n    window-ms: 2000\n    required-attacks: 4",
              "TriggerBotA": "TriggerBotA:\n    maximum-aim-error: 0.55\n    reaction-window-ms: 45\n    sample-window-ms: 3000\n    minimum-attack-gap-ms: 65\n    required-attacks: 5",
              "ChestStealerA": "ChestStealerA:\n    window-ms: 250\n    max-clicks: 10\n    min-quick-moves: 6",
              "BaritoneB": "BaritoneB:\n    required-turns: 6\n    minimum-turn-degrees: 12.0\n    maximum-turn-degrees: 90.0\n    maximum-angle-variation: 0.10\n    maximum-interval-variation: 0.15\n    minimum-speed: 0.08",
              "AutoFishA": "AutoFishA:\n    minimum-interval-ms: 35\n    maximum-interval-ms: 280\n    required-intervals: 5\n    maximum-variation: 0.75",
              "BadDig": "BadDig:\n    minimum-duration-ms: 45\n    window: 7\n    required: 5",
              "InvHitA": "InvHitA:\n    window-ms: 1200\n    open-grace-ms: 180\n    required-attacks: 2",
              "ElytraAimA": "ElytraAimA:\n    minimum-snap-degrees: 13.0\n    maximum-aim-error: 1.2\n    required-hits: 3\n    hit-window: 6",
              "ElytraAimB": "ElytraAimB:\n    minimum-target-movement: 0.10\n    maximum-spatial-error: 0.16\n    required-hits: 4\n    hit-window: 7",
              "AimA": "AimA:\n    minimum-samples: 10\n    maximum-cv: 0.16\n    minimum-direction-consistency: 0.95\n    maximum-aim-error: 1.4\n    attack-window: 6\n    required-attacks: 3",
              "AimC": "AimC:\n    minimum-snap-degrees: 13.0\n    minimum-acceleration: 8.0\n    minimum-jerk: 12.0\n    maximum-smooth-cv: 0.18\n    maximum-aim-error: 1.3\n    required-hits: 3\n    window: 6",
              "AimD": "AimD:\n    grid-tolerance: 0.14\n    maximum-aim-error: 2.0\n    grid-window: 12\n    minimum-off-grid-samples: 9\n    attack-window: 6\n    required-attacks: 3",
              "AimE": "AimE:\n    minimum-target-movement: 0.12\n    maximum-spatial-error: 0.08\n    required-hits: 5\n    window: 7",
              "AimF": "AimF:\n    minimum-rotation-degrees: 12.0\n    minimum-reaction-ms: 20\n    maximum-reaction-ms: 140\n    maximum-aim-error: 0.9\n    maximum-reaction-cv: 0.20\n    window: 8\n    required-switches: 5",
              "ScaffoldD": "ScaffoldD:\n    minimum-down-snap: 24.0\n    minimum-return-snap: 18.0\n    window: 6\n    required-evidence: 3",
              "AutoClickerA": "AutoClickerA:\n    sample-count: 16\n    required-windows: 3\n    minimum-interval-ms: 35\n    maximum-interval-ms: 160\n    maximum-cv: 0.025",
              "MaceSwapA": "MaceSwapA:\n    maximum-cycle-ms: 700\n    maximum-attack-delay-ms: 350\n    cycle-window-ms: 5000\n    required-cycles: 3",
              "MorePacketsA": "MorePacketsA:\n    window-ms: 1000\n    maximum-packets: 34\n    required-windows: 3",
              "AuraA": "AuraA:\n    window: 7\n    required-evidence: 3\n    maximum-distance: 5.5",
              "AuraB": "AuraB:\n    minimum-interval-ms: 75\n    maximum-interval-ms: 500\n    sample-count: 20\n    maximum-cv: 0.012\n    minimum-target-switches: 5\n    required-windows: 3",
          }
          for lang in ("en", "ru"):
              config_path = root / "common/src/main/resources/config" / f"{lang}.yml"
              config_text = config_path.read_text(encoding="utf-8")
              config_text = re.sub(r"(?m)^Simulation:", "Prediction:", config_text, count=1)

              # Lower the actual NoSlow threshold, not unrelated thresholds elsewhere in the config.
              match = re.search(r"(?ms)^NoSlow:\n(.*?)(?=^[A-Za-z][A-Za-z0-9_-]*:\n|\Z)", config_text)
              if not match:
                  raise SystemExit(f"NoSlow config section missing in {config_path}")
              no_slow_section = match.group(1)
              no_slow_section, count = re.subn(r"(?m)^    threshold: 0\.001$", "    threshold: 0.0001", no_slow_section, count=1)
              if count != 1:
                  raise SystemExit(f"NoSlow threshold not found in {config_path}")
              config_text = config_text[:match.start(1)] + no_slow_section + config_text[match.end(1):]

              # Replace existing sections by top-level YAML section boundaries; append them when absent.
              config_lines = config_text.splitlines()
              for key in ("KillAuraA", "KillAuraB", "KillAuraC", "KillAuraD", "AimA", "AimC", "AimD", "AimE", "AimF", "ScaffoldA", "ScaffoldD", "AirStuckB", "AutoClickerA", "MaceSwapA", "MorePacketsA", "AuraA", "AuraB"):
                  starts = [i for i, line in enumerate(config_lines) if line == key + ":"]
                  if len(starts) > 1:
                      raise SystemExit(f"Found duplicate {key} config sections in {config_path}")
                  block_lines = new_check_defaults[key].splitlines()
                  if starts:
                      start = starts[0]
                      end = start + 1
                      while end < len(config_lines):
                          line = config_lines[end]
                          if line and not line[0].isspace() and line.endswith(":"):
                              break
                          end += 1
                      config_lines[start:end] = block_lines + [""]
                  else:
                      if config_lines and config_lines[-1].strip():
                          config_lines.append("")
                      config_lines.extend(block_lines)
                      config_lines.append("")
              config_text = "\n".join(config_lines).rstrip() + "\n"

              for key, block in new_check_defaults.items():
                  if re.search(rf"(?m)^{re.escape(key)}:", config_text):
                      continue
                  config_text = config_text.rstrip() + "\n\n" + block + "\n"
              config_path.write_text(config_text, encoding="utf-8")

          # Keep only English and Russian resource locales, with English as fallback for all others.
          for folder_name in ("config", "messages", "punishments", "database", "discord"):
              folder = root / "common/src/main/resources" / folder_name
              if folder.exists():
                  for locale_file in folder.glob("*.yml"):
                      if locale_file.stem not in ("en", "ru"):
                          locale_file.unlink()

          print("Applied renamed checks, AirStuck watchdog, requested checks, AimB false-positive hardening, config defaults, unbolded alerts, and ru/en-only locales.")
          PY

      - name: Build only the Bukkit/Paper plugin
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon clean :bukkit:shadowJar -Prelease=true -PshadePE=true -Prelocate=true

      - name: Verify and package the ready-to-install plugin and source
        shell: bash
        run: |
          set -euo pipefail

          PLUGIN_DIR="$PROJECT_DIR/bukkit/build/libs"
          mapfile -t PLUGIN_JARS < <(find "$PLUGIN_DIR" -maxdepth 1 -type f -name 'cwanticheat-bukkit-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)

          if [[ "${#PLUGIN_JARS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one cwanticheat-bukkit plugin JAR, found ${#PLUGIN_JARS[@]}."
            printf '%s\n' "${PLUGIN_JARS[@]}"
            exit 1
          fi

          PLUGIN_JAR="${PLUGIN_JARS[0]}"
          unzip -tq "$PLUGIN_JAR"
          unzip -p "$PLUGIN_JAR" plugin.yml > "$RUNNER_TEMP/plugin.yml"

          grep -Eq '^name: CWanticheat$' "$RUNNER_TEMP/plugin.yml"
          grep -Eq '^main: ac\.grim\.grimac\.platform\.bukkit\.GrimACBukkitLoaderPlugin$' "$RUNNER_TEMP/plugin.yml"

          jar tf "$PLUGIN_JAR" > "$RUNNER_TEMP/plugin-entries.txt"
          if ! grep -q '^ac/grim/grimac/shaded/packetevents/' "$RUNNER_TEMP/plugin-entries.txt"; then
            echo "::error::PacketEvents classes are missing; refusing to publish a non-standalone plugin."
            exit 1
          fi

          for class in \
            ac/grim/grimac/checks/impl/movement/AirStuckA.class \
            ac/grim/grimac/checks/impl/movement/AirStuckB.class \
            ac/grim/grimac/checks/impl/movement/HighJumpA.class \
            ac/grim/grimac/checks/impl/inventory/AutoSwapA.class \
            ac/grim/grimac/checks/impl/inventory/GhostHandA.class \
            ac/grim/grimac/checks/impl/scaffolding/ScaffoldA.class \
            ac/grim/grimac/checks/impl/baritone/BaritoneA.class \
            ac/grim/grimac/checks/impl/movement/VoidClip.class \
            ac/grim/grimac/checks/impl/movement/StrafeA.class \
            ac/grim/grimac/checks/impl/movement/StrafeB.class \
            ac/grim/grimac/checks/impl/ronex/RonexExtraChecks\$BlockReach.class \
            ac/grim/grimac/checks/impl/ronex/RonexExtraChecks\$ScaffoldB.class \
            ac/grim/grimac/checks/impl/ronex/RonexExtraChecks\$ScaffoldC.class \
            ac/grim/grimac/checks/impl/ronex/RonexExtraChecks\$AutoCrystalA.class \
            ac/grim/grimac/checks/impl/ronex/RonexExtraChecks\$ChestStealerA.class \
            ac/grim/grimac/checks/impl/ronex/RonexExtraChecks\$BaritoneB.class \
            ac/grim/grimac/checks/impl/ronex/RonexExtraChecks\$BadDig.class \
            ac/grim/grimac/checks/impl/ronex/RonexAdvancedChecks\$AutoFishA.class \
            ac/grim/grimac/checks/impl/combat/CriticalsA.class \
            ac/grim/grimac/checks/impl/combat/TriggerBotA.class \
            ac/grim/grimac/checks/impl/combat/InvHitA.class \
            ac/grim/grimac/checks/impl/aim/ElytraAimA.class \
            ac/grim/grimac/checks/impl/aim/ElytraAimB.class \
            ac/grim/grimac/checks/impl/aim/AimA.class \
            ac/grim/grimac/checks/impl/ronex/RonexNewChecks\$AutoClickerA.class \
            ac/grim/grimac/checks/impl/ronex/RonexNewChecks\$MaceSwapA.class \
            ac/grim/grimac/checks/impl/ronex/RonexNewChecks\$MorePacketsA.class \
            ac/grim/grimac/checks/impl/ronex/RonexNewChecks\$ScaffoldD.class \
            ac/grim/grimac/checks/impl/ronex/RonexNewChecks\$AimC.class \
            ac/grim/grimac/checks/impl/ronex/RonexNewChecks\$AimD.class \
            ac/grim/grimac/checks/impl/ronex/RonexNewChecks\$AimE.class \
            ac/grim/grimac/checks/impl/ronex/RonexNewChecks\$AuraA.class \
            ac/grim/grimac/checks/impl/aim/AimF.class \
            ac/grim/grimac/checks/impl/combat/AuraB.class \
            ac/grim/grimac/checks/impl/combat/KillAuraD.class \
            ac/grim/grimac/manager/tick/impl/AirStuckWatchdog.class; do
            if ! grep -q "^$class$" "$RUNNER_TEMP/plugin-entries.txt"; then
              echo "::error::Missing new check class in the plugin: $class"
              exit 1
            fi
          done

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$PLUGIN_JAR" "$GITHUB_WORKSPACE/dist/CWanticheat.jar"
          echo "Verified ready-to-install Bukkit/Paper plugin: dist/CWanticheat.jar"

          cd "$PROJECT_DIR"
          zip -qr "$GITHUB_WORKSPACE/dist/CWanticheat-source.zip" . \
            -x '*/build/*' '*/.gradle/*' '.gradle/*' '.git/*' '*/.git/*' '*/.idea/*'

      - name: Upload ready-to-install plugin
        uses: actions/upload-artifact@v4
        with:
          name: CWanticheat-JAR
          path: dist/CWanticheat.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: CWanticheat-source
          path: dist/CWanticheat-source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach plugin and source to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CWanticheat.jar
            dist/CWanticheat-source.zip
