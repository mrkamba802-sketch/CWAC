                  Matcher groupMatcher = groupPattern.matcher(configString);
                  if (!groupMatcher.find()) {
                      StringBuilder out = new StringBuilder(configString);
                      if (!configString.endsWith("\n")) out.append('\n');
                      out.append("\n  ").append(groupName).append(":\n")
                              .append("    remove-violations-after: 300\n")
                              .append("    checks:\n");
