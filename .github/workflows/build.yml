name: Build CWanticheat

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Bukkit/Paper plugin and source archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract source archive and apply punishment configs
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$GITHUB_WORKSPACE/CWanticheat-source.zip"
          if [[ ! -f "$ARCHIVE" ]]; then
            echo "::error::CWanticheat-source.zip was not found in the repository root."
            exit 1
          fi

          EXTRACT_DIR="$RUNNER_TEMP/cwanticheat-source"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ARCHIVE" -d "$EXTRACT_DIR"

          PROJECT_DIR=""
          if [[ -f "$EXTRACT_DIR/gradlew" ]]; then
            PROJECT_DIR="$EXTRACT_DIR"
          else
            WRAPPER="$(find "$EXTRACT_DIR" -type f -name gradlew -print -quit || true)"
            if [[ -n "$WRAPPER" ]]; then
              PROJECT_DIR="$(dirname "$WRAPPER")"
            else
              SETTINGS="$(find "$EXTRACT_DIR" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit || true)"
              if [[ -n "$SETTINGS" ]]; then
                PROJECT_DIR="$(dirname "$SETTINGS")"
              fi
            fi
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::Could not locate the Gradle project inside CWanticheat-source.zip."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"

          CONFIG_SOURCE="$GITHUB_WORKSPACE/CWanticheat/common/src/main/resources/punishments"
          if [[ -d "$CONFIG_SOURCE" ]]; then
            mkdir -p "$PROJECT_DIR/common/src/main/resources/punishments"
            cp -f "$CONFIG_SOURCE"/*.yml "$PROJECT_DIR/common/src/main/resources/punishments/"
            echo "Applied grouped punishment configs from the repository."
          else
            echo "::error::Grouped punishment config directory was not found."
            exit 1
          fi

          SOURCE_OVERLAY="$GITHUB_WORKSPACE/CWanticheat/common/src/main/java"
          if [[ -d "$SOURCE_OVERLAY" ]]; then
            mkdir -p "$PROJECT_DIR/common/src/main/java"
            cp -a "$SOURCE_OVERLAY/." "$PROJECT_DIR/common/src/main/java/"
            echo "Applied new check source files from the repository."
          else
            echo "::error::Check source overlay directory was not found."
            exit 1
          fi

          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])

          def replace_once(path: Path, old: str, new: str):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one patch anchor in {path}, found {count}: {old[:90]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          manager = root / "common/src/main/java/ac/grim/grimac/manager/CheckManager.java"
          replace_once(manager,
              "import ac.grim.grimac.checks.impl.aim.AimDuplicateLook;",
              "import ac.grim.grimac.checks.impl.aim.AimA;\nimport ac.grim.grimac.checks.impl.aim.AimB;\nimport ac.grim.grimac.checks.impl.aim.AimDuplicateLook;")
          replace_once(manager,
              "import ac.grim.grimac.checks.impl.groundspoof.NoFall;",
              "import ac.grim.grimac.checks.impl.groundspoof.NoFall;\nimport ac.grim.grimac.checks.impl.groundspoof.NoFallA;")
          replace_once(manager,
              "import ac.grim.grimac.checks.impl.movement.NoSlow;",
              "import ac.grim.grimac.checks.impl.movement.AirStuck;\nimport ac.grim.grimac.checks.impl.movement.NoSlow;\nimport ac.grim.grimac.checks.impl.movement.NoSlowA;\nimport ac.grim.grimac.checks.impl.movement.NoWebA;\nimport ac.grim.grimac.checks.impl.movement.NoWebB;")
          replace_once(manager,
              ".put(Reach.class, new Reach(player))",
              ".put(Reach.class, new Reach(player))\n                .put(KillAuraA.class, new KillAuraA(player))\n                .put(KillAuraB.class, new KillAuraB(player))")
          replace_once(manager,
              ".put(NoFall.class, new NoFall(player))",
              ".put(NoFall.class, new NoFall(player))\n                .put(NoFallA.class, new NoFallA(player))")
          replace_once(manager,
              ".put(AimProcessor.class, new AimProcessor(player))",
              ".put(AimProcessor.class, new AimProcessor(player))\n                .put(AimA.class, new AimA(player))\n                .put(AimB.class, new AimB(player))")
          replace_once(manager,
              ".put(NoSlow.class, new NoSlow(player))",
              ".put(NoSlow.class, new NoSlow(player))\n                .put(NoSlowA.class, new NoSlowA(player))\n                .put(NoWebA.class, new NoWebA(player))\n                .put(NoWebB.class, new NoWebB(player))\n                .put(AirStuck.class, new AirStuck(player))")

          engine = root / "common/src/main/java/ac/grim/grimac/predictionengine/predictions/PredictionEngine.java"
          replace_once(engine,
              "package ac.grim.grimac.predictionengine.predictions;\n",
              "package ac.grim.grimac.predictionengine.predictions;\n\nimport ac.grim.grimac.checks.impl.movement.NoSlowA;\nimport ac.grim.grimac.checks.impl.movement.NoWebA;\nimport ac.grim.grimac.checks.impl.movement.NoWebB;\n")
          old_hook = """            if (player.packetStateData.isSlowedByUsingItem() && !clientVelAfterInput.isFlipItem()) {
                player.checkManager.getNoSlow().handlePredictionAnalysis(Math.sqrt(player.uncertaintyHandler.reduceOffset(resultAccuracy)));
            }"""
          new_hook = """            if (player.packetStateData.isSlowedByUsingItem() && !clientVelAfterInput.isFlipItem()) {
                double itemUseOffset = Math.sqrt(player.uncertaintyHandler.reduceOffset(resultAccuracy));
                player.checkManager.getNoSlow().handlePredictionAnalysis(itemUseOffset);
                player.checkManager.get(NoSlowA.class).handlePredictionAnalysis(itemUseOffset);
            }

            int webMask = StuckSpeed.COBWEB.getIndex() | StuckSpeed.COBWEB_WEAVING.getIndex();
            if ((clientVelAfterInput.stuckSpeedMultiplier.getIndex() & webMask) != 0) {
                double webOffset = Math.sqrt(player.uncertaintyHandler.reduceOffset(resultAccuracy));
                player.checkManager.get(NoWebA.class).handlePredictionAnalysis(webOffset);

                double horizontalError = Math.pow(outputVel.getX() - player.actualMovement.getX(), 2)
                        + Math.pow(outputVel.getZ() - player.actualMovement.getZ(), 2);
                double horizontalOffset = Math.sqrt(player.uncertaintyHandler.reduceOffset(horizontalError));
                player.checkManager.get(NoWebB.class).handlePredictionAnalysis(horizontalOffset);
            }"""
          replace_once(engine, old_hook, new_hook)
          print("Patched check registration and prediction hooks.")
          PY

      - name: Build only the Bukkit/Paper plugin
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon clean :bukkit:shadowJar -Prelease=true -PshadePE=true -Prelocate=true

      - name: Verify and package the ready-to-install plugin and source
        shell: bash
        run: |
          set -euo pipefail

          PLUGIN_DIR="$PROJECT_DIR/bukkit/build/libs"
          mapfile -t PLUGIN_JARS < <(find "$PLUGIN_DIR" -maxdepth 1 -type f -name 'cwanticheat-bukkit-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)

          if [[ "${#PLUGIN_JARS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one cwanticheat-bukkit plugin JAR, found ${#PLUGIN_JARS[@]}."
            printf '%s\n' "${PLUGIN_JARS[@]}"
            exit 1
          fi

          PLUGIN_JAR="${PLUGIN_JARS[0]}"
          unzip -tq "$PLUGIN_JAR"
          unzip -p "$PLUGIN_JAR" plugin.yml > "$RUNNER_TEMP/plugin.yml"

          grep -Eq '^name: CWanticheat$' "$RUNNER_TEMP/plugin.yml"
          grep -Eq '^main: ac\.grim\.grimac\.platform\.bukkit\.GrimACBukkitLoaderPlugin$' "$RUNNER_TEMP/plugin.yml"

          jar tf "$PLUGIN_JAR" > "$RUNNER_TEMP/plugin-entries.txt"
          if ! grep -q '^ac/grim/grimac/shaded/packetevents/' "$RUNNER_TEMP/plugin-entries.txt"; then
            echo "::error::PacketEvents classes are missing; refusing to publish a non-standalone plugin."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$PLUGIN_JAR" "$GITHUB_WORKSPACE/dist/CWanticheat.jar"
          echo "Verified ready-to-install Bukkit/Paper plugin: dist/CWanticheat.jar"

          cd "$PROJECT_DIR"
          zip -qr "$GITHUB_WORKSPACE/dist/CWanticheat-source.zip" . \
            -x '*/build/*' '*/.gradle/*' '.gradle/*' '.git/*' '*/.git/*' '*/.idea/*'

      - name: Upload ready-to-install plugin
        uses: actions/upload-artifact@v4
        with:
          name: CWanticheat-JAR
          path: dist/CWanticheat.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: CWanticheat-source
          path: dist/CWanticheat-source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach plugin and source to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CWanticheat.jar
            dist/CWanticheat-source.zip
